<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Study2Gate</title>

    <meta
      name="description"
      content="Study2Gate - Academic resource sharing platform"
    />

    <meta name="theme-color" content="#1464d2" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS home-screen install support (Safari ignores the manifest for
         these; they need their own meta tags and a dedicated touch icon) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Study2Gate" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Browser tab / favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Open Graph: WhatsApp, Facebook, LinkedIn, Discord, etc. -->
    <meta property="og:title" content="Study2Gate" />
    <meta
      property="og:description"
      content="Study2Gate - Academic resource sharing platform"
    />
    <meta property="og:image" content="https://study-2gate.vercel.app/study2gate-logo.png" />
    <meta property="og:url" content="https://study-2gate.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Study2Gate" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Study2Gate" />
    <meta
      name="twitter:description"
      content="Study2Gate - Academic resource sharing platform"
    />
    <meta name="twitter:image" content="https://study-2gate.vercel.app/study2gate-logo.png" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
